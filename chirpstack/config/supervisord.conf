[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Todos los logs salen por la salida del contenedor (docker logs).

[program:postgres]
command=su-exec postgres postgres -D /data/postgres
priority=10
autorestart=true
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=su-exec redis redis-server --bind 127.0.0.1 --port 6379 --dir /data/redis --save "300 1 60 100" --appendonly no
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mosquitto]
command=mosquitto -c /etc/mosquitto/mosquitto.conf
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ChirpStack sale con error si PostgreSQL aún no acepta conexiones; supervisord
; lo reintenta hasta que arranca.
[program:chirpstack]
command=su-exec nobody /usr/bin/chirpstack -c /etc/chirpstack
priority=20
startsecs=5
startretries=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gateway-bridge]
command=su-exec nobody /usr/bin/chirpstack-gateway-bridge -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml
priority=30
startsecs=3
startretries=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Una sola vez al arrancar: configura ChirpStack con las variables de entorno y
; los CSV de /config. Para repetirlo sin reiniciar: docker exec <contenedor> provisionar
[program:provisionar]
command=/usr/local/bin/provisionar-al-arrancar
priority=40
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Cada 5 min manda el estado de los gateways a server_panel (herramientas/estado-gateways.js).
[program:estado-gateways]
command=node /app/herramientas/estado-gateways.js
priority=50
startsecs=5
startretries=100
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
